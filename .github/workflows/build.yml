name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodenya
        uses: actions/checkout@v4

      - name: Siapkan Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Buat File Keystore (Tanda Tangan)
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Rakit menjadi APK (Pakai Gradle bawaan Server)
        run: gradle assembleDebug

      - name: Simpan dan Sediakan APK untuk Diunduh
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Android-ku
          path: app/build/outputs/apk/debug/app-debug.apk
